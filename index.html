<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE Kontrolní Panel</title>

    <!-- MQTT.js z CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        :root {
            --primary-glow: rgba(0, 242, 254, 0.15);
            --secondary-glow: rgba(79, 172, 254, 0.15);
            --neon-green: #00ff88;
            --neon-red: #ff2d55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(circle at 10% 20%, var(--primary-glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, var(--secondary-glow) 0%, transparent 40%);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 30px;
        }

        header {
            text-align: center;
            margin: 10px 0 5px 0;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            margin-top: 4px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ff9f43;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            box-shadow: 0 0 8px #ff9f43;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .power-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .power-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .power-value {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
        }

        .power-unit {
            font-size: 1.2rem;
            font-weight: 500;
            color: #4facfe;
        }

        .bargraf-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .bargraf-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            border-radius: 6px;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bargraf-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: -5px;
            padding: 0 2px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .topic-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .topic-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .topic-val {
            font-size: 1.3rem;
            font-weight: 400;
            color: #f8fafc;
        }

        .panels-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
        }

        .panel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .solar-icon {
            width: 44px;
            height: 44px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.5));
        }

        .solar-icon path {
            fill: var(--neon-green);
            transition: all 0.3s ease;
        }

        .solar-icon.off {
            filter: none;
        }

        .solar-icon.off path {
            fill: #334155;
        }

        .panel-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .btn-reset {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.1) 0%, rgba(185, 28, 28, 0.2) 100%);
            border: 1px solid rgba(255, 45, 85, 0.2);
            color: #fca5a5;
            padding: 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
