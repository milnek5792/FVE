<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE Kontrolní Panel</title>

    <!-- MQTT.js z CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        :root {
            --primary-glow: rgba(0, 242, 254, 0.15);
            --secondary-glow: rgba(79, 172, 254, 0.15);
            --neon-green: #00ff88;
            --neon-red: #ff2d55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030712;
            background-image:
                radial-gradient(circle at 10% 20%, var(--primary-glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, var(--secondary-glow) 0%, transparent 40%);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header {
            text-align: center;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 500;
            color: #94a3b8;
            margin-top: 2px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #ff9f43;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            box-shadow: 0 0 6px #ff9f43;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 14px;
            padding: 12px 13px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        /* Hlavní výkon */
        .power-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .power-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
        }

        .power-value {
            font-size: 2.3rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 3px;
        }

        .power-unit {
            font-size: 0.95rem;
            font-weight: 500;
            color: #4facfe;
        }

        .bargraf-container {
            width: 100%;
            height: 10px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.3);
            margin-top: 4px;
        }

        .bargraf-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
            border-radius: 5px;
            transition: width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bargraf-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
            padding: 0 1px;
        }

        /* Jednotlivé hodnoty – každý na vlastní řádce */
        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.9);
        }

        .topic-row:last-child {
            border-bottom: none;
        }

        .topic-label {
            font-size: 0.78rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .topic-val {
            font-size: 1rem;
            font-weight: 500;
            color: #e5e7eb;
        }

        /* Panely */
        .panels-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 12px;
        }

        .panel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .solar-icon {
            width: 40px;
            height: 40px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.6));
        }

        .solar-icon .panel {
            fill: #22c55e; /* zelené FV panely */
        }

        .solar-icon .sun {
            fill: #facc15;
        }

        .solar-icon.off {
            filter: none;
        }

        .solar-icon.off .panel {
            fill: #4b5563;
        }

        .solar-icon.off .sun {
            fill: #6b7280;
        }

        .panel-label {
            font-size: 0.7rem;
            color: #9ca3af;
            font-weight: 500;
        }

        /* Tlačítko nulování */
        .btn-reset {
            width: 100%;
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.08) 0%, rgba(185, 28, 28, 0.22) 100%);
            border: 1px solid rgba(248, 113, 113, 0.6);
            color: #fecaca;
            padding: 9px;
            margin-top: 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .btn-reset:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.16) 0%, rgba(185, 28, 28, 0.3) 100%);
            border-color: rgba(248, 113, 113, 0.8);
        }

        .btn-reset span.icon {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>FVE 1</h1>
            <div class="status-bar">
                <span id="status-text">Připojování...</span>
                <span class="status-dot" id="pod"></span>
            </div>
        </header>

        <!-- Hlavní výkon FVE -->
        <div class="glass-card">
            <div class="power-section">
                <div class="power-title">Aktuální výkon FVE</div>
                <div class="power-value">
                    <span id="fvePower">--</span>
                    <span class="power-unit">W</span>
                </div>
                <div class="bargraf-container">
                    <div class="bargraf-fill" id="fvePowerBargraf"></div>
                </div>
                <div class="bargraf-labels">
                    <span>0 W</span>
                    <span>Max</span>
                </div>
            </div>
        </div>

        <!-- Jednotlivé výroby / spotřeba -->
        <div class="glass-card">
            <div class="topic-row">
                <div class="topic-label">Vyrobeno celkem</div>
                <div class="topic-val" id="totalEnergy">-- kWh</div>
            </div>
            <div class="topic-row">
                <div class="topic-label">Měsíční výroba</div>
                <div class="topic-val" id="actualMonthEnergy">-- kWh</div>
            </div>
            <div class="topic-row">
                <div class="topic-label">Denní výroba</div>
                <div class="topic-val" id="dailyEnergy">-- kWh</div>
            </div>
            <div class="topic-row">
                <div class="topic-label">Spotřeba domu</div>
                <div class="topic-val" id="realPower">-- W</div>
            </div>
        </div>

        <!-- Panely + nulování -->
        <div class="glass-card">
            <div class="panels-section">
                <div class="panel-wrapper">
                    <svg class="solar-icon" id="icon-rele1" viewBox="0 0 64 64">
                        <!-- slunce -->
                        <circle class="sun" cx="45" cy="17" r="5"/>
                        <!-- panel - šikmá deska -->
                        <rect class="panel" x="12" y="30" width="32" height="16" rx="2" ry="2" transform="skewX(-10)"/>
                        <!-- nožky panelu -->
                        <rect class="panel" x="16" y="46" width="4" height="4"/>
                        <rect class="panel" x="30" y="46" width="4" height="4"/>
                    </svg>
                    <div class="panel-label">FV panely 1</div>
                </div>

                <div class="panel-wrapper">
                    <svg class="solar-icon" id="icon-rele2" viewBox="0 0 64 64">
                        <circle class="sun" cx="45" cy="17" r="5"/>
                        <rect class="panel" x="12" y="30" width="32" height="16" rx="2" ry="2" transform="skewX(-10)"/>
                        <rect class="panel" x="16" y="46" width="4" height="4"/>
                        <rect class="panel" x="30" y="46" width="4" height="4"/>
                    </svg>
                    <div class="panel-label">FV panely 2</div>
                </div>
            </div>

            <button class="btn-reset" onclick="provedNulovani()">
                <span class="icon">✓</span>
                <span>Nulování denní výroby</span>
            </button>
        </div>
    </div>

    <script type="text/javascript">
        // MQTT knihovna (podpora jak mqtt.default, tak mqtt)
        window.mqttLib = (window.mqtt && window.mqtt.default) ? window.mqtt.default : window.mqtt;

        const EMQX_BROKER_URL = "wss://n9e16b3c.ala.eu-central-1.emqxsl.com:8084/mqtt";

        const options = {
            clientId: "fve1_pwa_" + Math.random().toString(16).substr(2, 4),
            username: "FVE1WebApp",
            password: "mmVHNn6bSLZ59Tw",
            connectTimeout: 5000,
            keepalive: 60,
            clean: true
        };

        window.client = window.mqttLib.connect(EMQX_BROKER_URL, options);

        client.on('connect', () => {
            document.getElementById("status-text").innerText = "Online";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#00ff88";
            dot.style.boxShadow = "0 0 6px #00ff88";

            client.subscribe("fve/mereni/totalEnergy");
            client.subscribe("fve/mereni/actualMonthEnergy");
            client.subscribe("fve/mereni/realPower");
            client.subscribe("fve/mereni/fvePower");
            client.subscribe("fve/mereni/dailyEnergy");
            client.subscribe("fve/stav/rele1");
            client.subscribe("fve/stav/rele2");
        });

        client.on('error', () => {
            document.getElementById("status-text").innerText = "Chyba sítě";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#ff2d55";
            dot.style.boxShadow = "0 0 6px #ff2d55";
        });

        client.on('offline', () => {
            document.getElementById("status-text").innerText = "Odpojeno";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#ff2d55";
            dot.style.boxShadow = "0 0 6px #ff2d55";
        });

        client.on('reconnect', () => {
            document.getElementById("status-text").innerText = "Připojování...";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#ff9f43";
            dot.style.boxShadow = "0 0 6px #ff9f43";
        });

        // pomocná funkce na zaokrouhlení na 0 desetinných míst
        function format0(x) {
            const n = parseFloat(x);
            if (isNaN(n)) return x;
            return Math.round(n).toString();
        }

        client.on('message', (topic, message) => {
            const payloadRaw = message.toString();

            if (topic === "fve/mereni/totalEnergy") {
                const v =
