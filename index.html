<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE Kontrolní Panel</title>

    <!-- MQTT.js z CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        :root {
            --primary-glow: rgba(0, 242, 254, 0.15);
            --secondary-glow: rgba(79, 172, 254, 0.15);
            --neon-green: #00ff88;
            --neon-red: #ff2d55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030712;
            background-image:
                radial-gradient(circle at 10% 20%, var(--primary-glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, var(--secondary-glow) 0%, transparent 40%);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header {
            margin-bottom: 6px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #94a3b8;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #ff9f43;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #ff9f43;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 14px;
            padding: 12px 13px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        /* Vyrobeno celkem – první karta */
        .total-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .total-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
        }
        .total-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e5e7eb;
        }

        /* Hlavní výkon */
        .power-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .power-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
        }
        .power-value {
            font-size: 2.3rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 3px;
        }
        .power-unit {
            font-size: 0.95rem;
            font-weight: 500;
            color: #4facfe;
        }
        .bargraf-container {
            width: 100%;
            height: 10px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.3);
            margin-top: 4px;
        }
        .bargraf-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
            border-radius: 5px;
            transition: width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .bargraf-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
            padding: 0 1px;
        }

        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.9);
        }
        .topic-row:last-child {
            border-bottom: none;
        }
        .topic-label {
            font-size: 0.78rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .topic-val {
            font-size: 1rem;
            font-weight: 500;
            color: #e5e7eb;
        }

        .panels-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 12px;
        }
        .panel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .solar-icon {
            width: 46px;
            height: 46px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.6));
        }
        /* tmavší zelená */
        .solar-icon .panel,
        .solar-icon .cell {
            fill: #16a34a;
        }
        .solar-icon .sun {
            fill: #facc15;
        }
        .solar-icon.off {
            filter: none;
        }
        .solar-icon.off .panel,
        .solar-icon.off .cell {
            fill: #4b5563;
        }
        .solar-icon.off .sun {
            fill: #6b7280;
        }
        .panel-label {
            font-size: 0.7rem;
            color: #9ca3af;
            font-weight: 500;
        }

        .bottom-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .daily-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.9rem;
        }
        .daily-label {
            font-size: 0.78rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .daily-val {
            font-size: 1rem;
            font-weight: 500;
            color: #e5e7eb;
        }

        .btn-reset {
            width: 100%;
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.08) 0%, rgba(185, 28, 28, 0.22) 100%);
            border: 1px solid rgba(248, 113, 113, 0.6);
            color: #fecaca;
            padding: 9px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .btn-reset:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.16) 0%, rgba(185, 28, 28, 0.3) 100%);
            border-color: rgba(248, 113, 113, 0.8);
        }
        .btn-reset span.icon {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-row">
                <div class="header-title">
