<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE 1</title>
    <!-- KLÍČOVÝ ŘÁDEK: Načtení knihovny, který vyřeší chybu ReferenceError -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-green: #00ff88;
            --neon-red: #ff2d55;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0b0f19; color: #ffffff; min-height: 100vh; }
        .header-bar { 
            background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(10px); padding: 20px 15px; 
            display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--glass-border); 
            position: sticky; top: 0; z-index: 100;
        }
        .header-title { font-size: 1.4rem; font-weight: 700; }
        .status-container { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; }
        .status-dot { width: 10px; height: 10px; background-color: #ff9f43; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #ff9f43; }
        .dashboard { padding: 15px; max-width: 500px; margin: 0 auto; }
        .box { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(10px);
            padding: 16px 20px; margin-bottom: 12px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .label { font-size: 0.85rem; color: #a0aec0; margin-bottom: 6px; text-transform: uppercase; }
        .value { font-size: 2.2rem; font-weight: 300; }
        .value-small { font-size: 1.6rem; }
        .box-highlight { background: rgba(74, 144, 226, 0.08); border: 1px solid rgba(74, 144, 226, 0.3); }
        .bargraf-container { background: rgba(255,255,255,0.1); width: 100%; height: 8px; margin-top: 15px; border-radius: 4px; overflow: hidden; }
        .bargraf-fill { background: linear-gradient(90deg, #4a90e2, var(--neon-green)); width: 0%; height: 100%; transition: width 0.4s ease-out; box-shadow: 0 0 10px #4a90e2; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .grid-2 .box { margin-bottom: 0; display: flex; align-items: center; gap: 15px; padding: 14px 16px; }
        .panel-icon-svg { width: 42px; height: 42px; transition: all 0.4s ease; filter: drop-shadow(0 0 8px rgba(0,255,136,0.5)); }
        .panel-icon-svg path { fill: var(--neon-green); }
        .panel-icon-svg.off path { fill: #334155; }
        .panel-icon-svg.off { filter: none; }
        .btn-nulovani { 
            background: linear-gradient(135deg, var(--neon-red), #b91c1c); color: white; border: none; padding: 15px; 
            font-size: 1rem; font-weight: 700; width: 100%; height: 100%; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; text-transform: uppercase; border-radius: 16px; box-shadow: 0 4px 15px rgba(255,45,85,0.3);
        }
        .btn-nulovani:active { transform: scale(0.98); background: #d81b43; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-title"><span>FVE 1</span></div>
        <div class="status-container">
            <span id="status-text" style="font-size: 0.8rem; margin-right: 8px; color: #eee;">Připojování...</span>
            <div class="status-dot" id="pod"></div>
        </div>
    </div>

    <div class="dashboard">
        <div class="box">
            <div class="label">Vyrobeno celkem</div>
            <div class="value" id="totalEnergy">-- kWh</div>
        </div>

        <div class="box">
            <div class="label">Měsíční výroba</div>
            <div class="value-small" id="actualMonthEnergy">-- kWh</div>
        </div>

        <div class="box">
            <div class="label">Spotřeba domu</div>
            <div class="value-small" id="realPower">-- W</div>
        </div>

        <div class="box box-highlight">
            <div class="label" style="display:inline;">Aktuální výkon: </div>
            <div class="label" style="display:inline; color:white; font-size:1.05rem;" id="fvePower">-- W</div>
            <div class="bargraf-container">
                <div class="bargraf-fill" id="fvePowerBargraf"></div>
            </div>
        </div>

        <div class="grid-2">
            <div class="box">
                <svg class="panel-icon-svg" id="icon-rele1" viewBox="0 0 24 24">
                    <path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zm-12 6h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
                </svg>
                <div class="label" style="color:white; margin:0;">Fv panely 1</div>
            </div>

            <div class="box">
                <svg class="panel-icon-svg" id="icon-rele2" viewBox="0 0 24 24">
                    <path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zm-12 6h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
                </svg>
                <div class="label" style="color:white; margin:0;">Fv panely 2</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="box">
                <div>
                    <div class="label">Denní výroba</div>
                    <div class="value-small" id="dailyEnergy">-- kWh</div>
                </div>
            </div>

            <div style="padding:0; margin:0;">
                <button class="btn-nulovani" onclick="provedNulovani()">✓ NULOVÁNÍ</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        console.log("mqtt objekt:", mqtt);
        console.log("mqtt.default:", mqtt.default);

        const EMQX_BROKER_URL = "wss://://emqxsl.com";

        const options = {
            clientId: "fve1_pwa_" + Math.random().toString(16).substr(2, 4),
            username: "FVE1WebApp",
            password: "mmVHNn6bSLZ59Tw",
            connectTimeout: 5000,
            keepalive: 60,
            clean: true
        };

        console.log("Volám mqtt.default.connect...");
        const client = mqtt.default.connect(EMQX_BROKER_URL, options);

        client.on('connect', () => {
            console.log("MQTT connected");
            document.getElementById("status-text").innerText = "Online";
            document.getElementById("pod").style.backgroundColor = "#00ff00";

            client.subscribe("fve/mereni/totalEnergy");
            client.subscribe("fve/mereni/actualMonthEnergy");
            client.subscribe("fve/mereni/realPower");
            client.subscribe("fve/mereni/fvePower");
            client.subscribe("fve/mereni/dailyEnergy");
            client.subscribe("fve/stav/rele1");
            client.subscribe("fve/stav/rele2");
        });

        client.on('error', (err) => {
            console.error("MQTT error:", err);
            document.getElementById("status-text").innerText = "Chyba sítě";
            document.getElementById("pod").style.backgroundColor = "#ff2d55";
        });

        client.on('offline', () => {
            console.log("MQTT offline");
            document.getElementById("status-text").innerText = "Odpojeno";
            document.getElementById("pod").style.backgroundColor = "#ff2d55";
        });

        client.on('reconnect', () => {
            console.log("MQTT reconnecting");
            document.getElementById("status-text").innerText = "Připojování...";
            document.getElementById("pod").style.backgroundColor = "#ff9f43";
        });

        client.on('message', (topic, message) => {
            const payload = message.toString();

            if (topic === "fve/mereni/totalEnergy") {
                document.getElementById("totalEnergy").innerText = payload + " kWh";
            }
            else if (topic === "fve/mereni/actualMonthEnergy") {
                document.getElementById("actualMonthEnergy").innerText = payload + " kWh";
            }
            else if (topic === "fve/mereni/realPower") {
                document.getElementById("realPower").innerText = payload + " W";
            }
            else if (topic === "fve/mereni/fvePower") {
                document.getElementById("fvePower").innerText = payload + " W";
                const maxVykon = 1350;
                const ciselnaHodnota = parseFloat(payload) || 0;
                let procento = (ciselnaHodnota / maxVykon) * 100;
                if (procento > 100) procento = 100;
                document.getElementById("fvePowerBargraf").style.width = procento + "%";
            }
            else if (topic === "fve/mereni/dailyEnergy") {
                document.getElementById("dailyEnergy").innerText = payload + " kWh";
            }
            else if (topic === "fve/stav/rele1") {
                document.getElementById("icon-rele1").classList.toggle("off", payload === "0" || payload.toUpperCase() === "OFF");
            }
            else if (topic === "fve/stav/rele2") {
                document.getElementById("icon-rele2").classList.toggle("off", payload === "0" || payload.toUpperCase() === "OFF");
            }
        });

        function provedNulovani() {
            if (confirm("Opravdu chcete vynulovat denní výrobu?")) {
                client.publish("fve/prikazy", "reset_day");
                alert("Příkaz reset_day byl odeslán.");
            }
        }
    </script>
</body>
</html>
