<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVE Kontrolní Panel</title>

    <!-- MQTT.js z CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        :root {
            --primary-glow: rgba(0, 242, 254, 0.15);
            --secondary-glow: rgba(79, 172, 254, 0.15);
            --neon-green: #00ff88;
            --neon-red: #ff2d55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030712;
            background-image:
                radial-gradient(circle at 10% 20%, var(--primary-glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, var(--secondary-glow) 0%, transparent 40%);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 8px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 500;
            color: #94a3b8;
            margin-top: 1px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #ff9f43;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            box-shadow: 0 0 6px #ff9f43;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 10px 11px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.45);
        }

        .power-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .power-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
        }

        .power-value {
            font-size: 2.1rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 3px;
        }

        .power-unit {
            font-size: 0.9rem;
            font-weight: 500;
            color: #4facfe;
        }

        .bargraf-container {
            width: 100%;
            height: 9px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.3);
            margin-top: 3px;
        }

        .bargraf-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
            border-radius: 5px;
            transition: width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bargraf-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: #64748b;
            margin-top: 1px;
            padding: 0 1px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
        }

        .topic-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(51, 65, 85, 0.9);
            border-radius: 9px;
            padding: 7px 8px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .topic-label {
            font-size: 0.68rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .topic-val {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e5e7eb;
        }

        .panels-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
        }

        .panel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
        }

        .solar-icon {
            width: 34px;
            height: 34px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 5px rgba(0, 255, 136, 0.5));
        }

        .solar-icon path {
            fill: var(--neon-green);
            transition: all 0.3s ease;
        }

        .solar-icon.off {
            filter: none;
        }

        .solar-icon.off path {
            fill: #4b5563;
        }

        .panel-label {
            font-size: 0.68rem;
            color: #9ca3af;
            font-weight: 500;
        }

        .btn-reset {
            width: 100%;
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.08) 0%, rgba(185, 28, 28, 0.22) 100%);
            border: 1px solid rgba(248, 113, 113, 0.6);
            color: #fecaca;
            padding: 8px;
            margin-top: 7px;
            border-radius: 11px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .btn-reset:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.16) 0%, rgba(185, 28, 28, 0.3) 100%);
            border-color: rgba(248, 113, 113, 0.8);
        }

        .btn-reset span.icon {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>FVE 1</h1>
            <div class="status-bar">
                <span id="status-text">Připojování...</span>
                <span class="status-dot" id="pod"></span>
            </div>
        </header>

        <div class="glass-card">
            <div class="power-section">
                <div class="power-title">Aktuální výkon FVE</div>
                <div class="power-value">
                    <span id="fvePower">--</span>
                    <span class="power-unit">W</span>
                </div>
                <div class="bargraf-container">
                    <div class="bargraf-fill" id="fvePowerBargraf"></div>
                </div>
                <div class="bargraf-labels">
                    <span>0 W</span>
                    <span>Max</span>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="topics-grid">
                <div class="topic-card">
                    <div class="topic-label">Vyrobeno celkem</div>
                    <div class="topic-val" id="totalEnergy">-- kWh</div>
                </div>
                <div class="topic-card">
                    <div class="topic-label">Měsíční výroba</div>
                    <div class="topic-val" id="actualMonthEnergy">-- kWh</div>
                </div>
                <div class="topic-card">
                    <div class="topic-label">Denní výroba</div>
                    <div class="topic-val" id="dailyEnergy">-- kWh</div>
                </div>
                <div class="topic-card">
                    <div class="topic-label">Spotřeba domu</div>
                    <div class="topic-val" id="realPower">-- W</div>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="panels-section">
                <div class="panel-wrapper">
                    <svg class="solar-icon" id="icon-rele1" viewBox="0 0 64 64">
                        <path d="M32 18a14 14 0 1 0 14 14A14.016 14.016 0 0 0 32 18zm0-10a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0v-4a3 3 0 0 1 3-3zm0 42a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0v-4a3 3 0 0 1 3-3zm20-20a3 3 0 0 1-3 3h-4a3 3 0 0 1 0-6h4a3 3 0 0 1 3 3zm-34 0a3 3 0 0 1-3 3h-4a3 3 0 0 1 0-6h4a3 3 0 0 1 3 3zm26.728-11.728a3 3 0 0 1 0 4.243l-2.828 2.829a3 3 0 0 1-4.243-4.243l2.829-2.829a3 3 0 0 1 4.242 0zm-22.627 22.627a3 3 0 0 1 0 4.243l-2.829 2.829a3 3 0 0 1-4.242-4.243l2.828-2.829a3 3 0 0 1 4.243 0zm22.627 2.829a3 3 0 0 1-4.243 0l-2.829-2.829a3 3 0 0 1 4.243-4.243l2.829 2.829a3 3 0 0 1 0 4.243zm-22.627-22.627a3 3 0 0 1-4.243 0l-2.828-2.829a3 3 0 0 1 4.242-4.243l2.829 2.829a3 3 0 0 1 0 4.243z"/>
                    </svg>
                    <div class="panel-label">FV panely 1</div>
                </div>

                <div class="panel-wrapper">
                    <svg class="solar-icon" id="icon-rele2" viewBox="0 0 64 64">
                        <path d="M32 18a14 14 0 1 0 14 14A14.016 14.016 0 0 0 32 18zm0-10a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0v-4a3 3 0 0 1 3-3zm0 42a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0v-4a3 3 0 0 1 3-3zm20-20a3 3 0 0 1-3 3h-4a3 3 0 0 1 0-6h4a3 3 0 0 1 3 3zm-34 0a3 3 0 0 1-3 3h-4a3 3 0 0 1 0-6h4a3 3 0 0 1 3 3zm26.728-11.728a3 3 0 0 1 0 4.243l-2.828 2.829a3 3 0 0 1-4.243-4.243l2.829-2.829a3 3 0 0 1 4.242 0zm-22.627 22.627a3 3 0 0 1 0 4.243l-2.829 2.829a3 3 0 0 1-4.242-4.243l2.828-2.829a3 3 0 0 1 4.243 0zm22.627 2.829a3 3 0 0 1-4.243 0l-2.829-2.829a3 3 0 0 1 4.243-4.243l2.829 2.829a3 3 0 0 1 0 4.243zm-22.627-22.627a3 3 0 0 1-4.243 0l-2.828-2.829a3 3 0 0 1 4.242-4.243l2.829 2.829a3 3 0 0 1 0 4.243z"/>
                    </svg>
                    <div class="panel-label">FV panely 2</div>
                </div>
            </div>

            <button class="btn-reset" onclick="provedNulovani()">
                <span class="icon">✓</span>
                <span>Nulování denní výroby</span>
            </button>
        </div>
    </div>

    <script type="text/javascript">
        // Vytvoříme globální proměnné pro snadnou kontrolu v konzoli
        window.mqttLib = (window.mqtt && window.mqtt.default) ? window.mqtt.default : window.mqtt;
        console.log("mqttLib:", window.mqttLib);

        const EMQX_BROKER_URL = "wss://n9e16b3c.ala.eu-central-1.emqxsl.com:8084/mqtt";

        const options = {
            clientId: "fve1_pwa_" + Math.random().toString(16).substr(2, 4),
            username: "FVE1WebApp",
            password: "mmVHNn6bSLZ59Tw",
            connectTimeout: 5000,
            keepalive: 60,
            clean: true
        };

        window.client = window.mqttLib.connect(EMQX_BROKER_URL, options);
        console.log("MQTT connecting...");

        client.on('connect', () => {
            console.log("MQTT connected");
            document.getElementById("status-text").innerText = "Online";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#00ff88";
            dot.style.boxShadow = "0 0 6px #00ff88";

            client.subscribe("fve/mereni/totalEnergy");
            client.subscribe("fve/mereni/actualMonthEnergy");
            client.subscribe("fve/mereni/realPower");
            client.subscribe("fve/mereni/fvePower");
            client.subscribe("fve/mereni/dailyEnergy");
            client.subscribe("fve/stav/rele1");
            client.subscribe("fve/stav/rele2");
        });

        client.on('error', (err) => {
            console.error("MQTT error:", err);
            document.getElementById("status-text").innerText = "Chyba sítě";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#ff2d55";
            dot.style.boxShadow = "0 0 6px #ff2d55";
        });

        client.on('offline', () => {
            console.warn("MQTT offline");
            document.getElementById("status-text").innerText = "Odpojeno";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#ff2d55";
            dot.style.boxShadow = "0 0 6px #ff2d55";
        });

        client.on('reconnect', () => {
            console.log("MQTT reconnecting");
            document.getElementById("status-text").innerText = "Připojování...";
            const dot = document.getElementById("pod");
            dot.style.backgroundColor = "#ff9f43";
            dot.style.boxShadow = "0 0 6px #ff9f43";
        });

        client.on('message', (topic, message) => {
            const payload = message.toString();
            console.log("MQTT message:", topic, payload);

            if (topic === "fve/mereni/totalEnergy") {
                document.getElementById("totalEnergy").innerText = payload + " kWh";
            }
            else if (topic === "fve/mereni/actualMonthEnergy") {
                document.getElementById("actualMonthEnergy").innerText = payload + " kWh";
            }
            else if (topic === "fve/mereni/realPower") {
                document.getElementById("realPower").innerText = payload + " W";
            }
            else if (topic === "fve/mereni/fvePower") {
                document.getElementById("fvePower").innerText = payload;
                const maxVykon = 1350;
                const ciselnaHodnota = parseFloat(payload) || 0;
                let procento = (ciselnaHodnota / maxVykon) * 100;
                if (procento > 100) procento = 100;
                document.getElementById("fvePowerBargraf").style.width = procento + "%";
            }
            else if (topic === "fve/mereni/dailyEnergy") {
                document.getElementById("dailyEnergy").innerText = payload + " kWh";
            }
            else if (topic === "fve/stav/rele1") {
                const on = !(payload === "0" || payload.toUpperCase() === "OFF");
                document.getElementById("icon-rele1").classList.toggle("off", !on);
            }
            else if (topic === "fve/stav/rele2") {
                const on = !(payload === "0" || payload.toUpperCase() === "OFF");
                document.getElementById("icon-rele2").classList.toggle("off", !on);
            }
        });

        function provedNulovani() {
            if (confirm("Opravdu chcete provést nulování denní výroby?")) {
                if (client.connected) {
                    client.publish("fve/prikazy", "reset_day");
                } else {
                    alert("Aplikace není připojena k brokeru!");
                }
            }
        }
    </script>
</body>
</html>
