<!DOCTYPE html>

<head>

    <style>
        body { font-family: sans-serif; background-color: #161616; color: #ffffff; margin: 0; padding: 0; box-sizing: border-box; }
        .header-bar { background-color: #4a90e2; padding: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .header-title { font-size: 1.3rem; font-weight: bold; }
        .status-dot { width: 12px; height: 12px; background-color: #ff9f43; border-radius: 50%; display: inline-block; }
        .dashboard { padding: 10px; max-width: 500px; margin: 0 auto; }
        .box { background-color: #1a1a1a; border: 1px solid #333333; padding: 12px 15px; margin-bottom: 8px; text-align: left; }
        .label { font-size: 0.95rem; color: #aaaaaa; margin-bottom: 5px; }
        .value { font-size: 1.8rem; font-weight: normal; }
        .value-small { font-size: 1.3rem; }
        .box-highlight { padding-bottom: 18px; }
        .bargraf-container { background-color: #2a2a2a; width: 100%; height: 6px; margin-top: 12px; border-radius: 3px; overflow: hidden; }
        .bargraf-fill { background-color: #4a90e2; width: 0%; height: 100%; border-radius: 3px; transition: width 0.5s ease-in-out; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .grid-2 .box { margin-bottom: 0; display: flex; align-items: center; gap: 15px; }
        .panel-icon { display: grid; grid-template-columns: repeat(3, 8px); gap: 3px; }
        .panel-icon span { width: 8px; height: 8px; background-color: #00ff00; border-radius: 1px; }
        .panel-icon.off span { background-color: #444444; }
        .btn-nulovani { background-color: #ff2d55; color: white; border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-transform: uppercase; border: 1px solid #333333; box-sizing: border-box; }
        .btn-nulovani:active { background-color: #d81b43; }
    </style>
</head>
